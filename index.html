<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warehouse Inventory System | Java Project</title>
<style>
:root{--ink:#10284a;--tx:#4f5f78;--blue:#1f6fd1;--line:#d3dff2;--soft:#e6eefb}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:linear-gradient(180deg,#eef3fb,#dfe9f8 45%,#eef3fb);color:var(--tx);line-height:1.65;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{width:min(1120px,90%);margin:0 auto}
header{position:sticky;top:0;z-index:5;background:rgba(238,243,251,.93);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:10px;background:var(--soft);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:1.2rem}
.bt{display:block;color:var(--blue);font-weight:700;line-height:1.2}
.bs{display:block;font-size:.72rem}
nav{display:flex;gap:18px;flex-wrap:wrap}
nav a{font-size:.88rem;font-weight:600;color:var(--ink)}
.hero{padding:60px 0 70px}
.hero .wrap{display:grid;grid-template-columns:1.15fr 1fr;gap:36px;align-items:center}
.eb{font-size:.72rem;font-weight:700;letter-spacing:.14em;color:var(--blue);margin-bottom:14px}
h1{font-size:clamp(2rem,4.6vw,3.3rem);line-height:1.12;color:var(--ink);font-weight:800}
h2{font-size:clamp(1.5rem,3vw,2.1rem);color:var(--ink);font-weight:800;margin-bottom:12px}
.lead{margin-top:18px;max-width:520px}
.row{display:flex;flex-wrap:wrap;gap:14px;margin-top:24px}
.btn{display:inline-block;padding:12px 22px;border-radius:8px;font-weight:700;font-size:.92rem;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.pri:hover{background:#1859a9;border-color:#1859a9;color:#fff}
.side{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(31,111,209,.08)}
.dash{width:230px}
.dash h3{color:var(--ink);font-size:1rem;margin:10px 0}
.dash li{list-style:none;display:flex;align-items:center;gap:10px;font-size:.8rem;padding:6px 0}
.dash b,.ic{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--blue);display:grid;place-items:center;font-size:.72rem}
.photo{width:230px;height:230px;border-radius:14px;border:6px solid #fff;box-shadow:0 8px 24px rgba(31,111,209,.1);object-fit:cover;object-position:50% 62%;background:#fff}
section{padding:60px 0}
.g2{display:grid;grid-template-columns:1fr 1.3fr;gap:36px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px}
.card h4{color:var(--ink);margin:8px 0 2px}
.card p{font-size:.85rem}
.col{display:flex;flex-direction:column;align-items:flex-start;gap:14px;margin-top:22px}
.res{list-style:none;display:grid;gap:10px;max-width:640px;margin-top:16px}
.res li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:.9rem}
footer{border-top:1px solid var(--line);padding:24px 0;text-align:center;font-size:.85rem}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f7fd;border:1px solid var(--line);border-radius:10px;padding:18px;color:var(--ink);font:14px/1.7 Consolas,"Courier New",monospace;margin:20px 0}
.hide{display:none}
@media(max-width:860px){.hero .wrap,.g2,.g3,.g4{grid-template-columns:1fr}}
</style></head><body>

<div id="main">
<header><div class="wrap">
